<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jockey+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thumbnail</title>
    <link rel="stylesheet" href="../css/thumbnail.css" />
  </head>
  <body>
    <div class="divPagina">
      <div class="conteudo">
        <div class="divImagens">
          <img class="forma forma1" src="../assets/Forma1.png" class="forma" alt="">
          <img class="forma forma2" src="../assets/Forma2.png" alt="">
          <img class="forma forma3" src="../assets/Forma3.png" alt="">
          <img class="forma forma4" src="../assets/Forma4.png" alt="">
        </div>

        <div class="divLogin">
          <h1>Create your Free Account</h1>
          <div class="inputs">
            <label for="">Full Name</label
            ><input
              id="Name"
              type="text"
              placeholder="Enter your Full Name here"
            />
          </div>
          <div class="inputs">
            <label for="">Email</label
            ><input type="email" placeholder="Enter Your Email here" />
          </div>
          <div class="inputs">
            <label for="">Passaword</label
            ><input type="password" placeholder="Enter your Passaword Here" />
          </div>
          <button class="buttonCreate">Create Accont</button>
          <div class="divPossuiConta">
            <p>Already have a account?</p>
            <button>Log In</button>
          </div>
          <p class="or">- OR -</p>
          <div class="divBotoes">
            <button><img src="../assets/Icon-Google.svg" alt="">Sing up With Google</button
            ><button><img src="../assets/Icon-GitHub.svg" alt="">Sing up With GitHub</button>
          </div>
          <p class="reservado">Reserved Directs to Leo Barreto</p>
        </div>
      </div>
    </div>
  </body>
</html>
