<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jockey+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/registerPage.css" />
  </head>
  <body>
    <div class="divPagina">
      <div class="divPagEsquerdo">
        <img class="imagemMonitor" src="../assets/ImagemMonitor.png" alt="" />
        <div class="bastao bastao1"></div>
        <div class="bastao bastao2"></div>
        
      </div>
      <div class="divPagDireito">
        <h1>Please Fill out form to Register!</h1>
        <div class="login">
          <div class="inputs">
            <label for="">Full Name:</label><input type="text" />
          </div>
          <div class="inputs">
            <label for="">Username:</label><input type="text" />
          </div>
          <div class="inputs">
            <label for="">Email:</label><input type="text" />
          </div>
          <div class="inputs">
            <label for="">Password:</label><input type="text" />
          </div>
          <div class="inputs">
            <label for="">Confirm Password:</label><input type="text" />
          </div>
        </div>
        <button class="registerBT">Register</button>
        <div class="haveAccount">
          <p>Yes i have an account?</p>
          <button>Login</button>
        </div>
        <img class="mediaIcons" src="../assets/Social media icons.png" alt="" />
      </div>
    </div>
  </body>
</html>
