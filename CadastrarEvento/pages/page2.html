<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

  <body>
    <div class="pagina" id="inicio">
      <!-- CABEÇALHO -->
      <header>
        <img src="../Assets/pag2/senac 2.png" alt="" />
        <section>
          <ol>
            <li><a href="#inicio">Usuário</a></li>
            <li>Perfil</li>
            <li><a href="#evento">Evento</a></li>
            <li>Dashboard Adm</li>
          </ol>
        </section>
      </header>

      <!-- CONTEUDO -->

      <div class="conteudo">
        <h1>Cadastro de eventos</h1>

        <form>
          <div class="inputForm"> 
            <label>Nome:</label>
            <input type="" />
          </div>
          <div class="inputForm">
            <label>Data do evento:</label>
            <input type="" />
          </div>
          <div class="inputForm">
            <label>Horario:</label>
            <input type="" />
          </div>
          <div class="inputForm">
            <label>Capacidade de pessoas::</label>
            <input type="" />
          </div>
          <div class="inputForm">
            <label>Imagem:</label>
            <div class="inputImagem">
              <button>Escolher imagens</button>
              <input id="ip" type="" placeholder="Nehum arquivo escolhido"/>
            </div>
            
          </div>
          <div class="inputForm">
            <label>Local do evento:</label>
            <input type="" />
          </div>
          <div class="inputForm"> 
            <label>Preço:</label>
            <input type="" />
          </div>
        </form>
        <button class="continuar">Continuar cadastro</button>
      </div>
    </div>

    <div class="divLogoFinal">
      <div class="div1">
        <p>FAQ</p>
        <p>Termos de Uso</p>
        <p>Copyright</p>
      </div>
      <div class="div2">
        <p>Patrocinadores</p>
        <p>Política de Privacidade</p>
        <p>© Senac</p>
      </div>
      <div class="div3">
        <p>Apoio</p>
        <p>Redes Sociais</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>
      </div>
